<!doctype html><html><head><meta charset="utf-8"><title>⌘K Command Palette</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif}</style></head>
<body class="bg-slate-900/50 backdrop-blur-sm min-h-screen flex items-start justify-center pt-24">
<div class="w-full max-w-xl bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
  <div class="flex items-center gap-3 px-4 border-b border-slate-200 dark:border-slate-800">
    <span class="text-slate-400">🔎</span>
    <input class="flex-1 py-3 bg-transparent text-sm outline-none text-slate-900 dark:text-white" placeholder="Search features… (⌘K)" value="automation"/>
    <kbd class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500">ESC</kbd>
  </div>
  <ul role="listbox" class="py-2 text-sm">
    <li class="px-4 py-2 bg-blue-600 text-white flex justify-between" aria-selected="true">Workflows <span class="text-blue-200 text-xs">Automation</span></li>
    <li class="px-4 py-2 text-slate-700 dark:text-slate-300 flex justify-between">Automations <span class="text-slate-400 text-xs">Automation</span></li>
    <li class="px-4 py-2 text-slate-700 dark:text-slate-300 flex justify-between">Scheduler <span class="text-slate-400 text-xs">Automation</span></li>
    <li class="px-4 py-2 text-slate-700 dark:text-slate-300 flex justify-between">A2A Console <span class="text-slate-400 text-xs">Automation</span></li>
    <li class="px-4 py-2 text-slate-500 dark:text-slate-500 flex justify-between">Run Console <span class="text-xs">command</span></li>
  </ul>
  <div class="px-4 py-2 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 flex gap-4">
    <span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span>
    <span class="ml-auto" role="status">5 results</span>
  </div>
</div></body></html>
