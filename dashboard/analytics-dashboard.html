<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — XActions</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg: #000; --bg2: #111; --bg3: #1a1a1a; --border: #333; --text: #e0e0e0; --text2: #888; --accent: #1d9bf0; --green: #00c853; --red: #ff4444; --yellow: #ffb800; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; min-height: 100vh; }
    .sidebar-left { width: 240px; background: var(--bg2); border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; }
    .sidebar-left .logo { padding: 0 20px 20px; font-size: 20px; font-weight: 700; color: #fff; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--text2); text-decoration: none; font-size: 14px; transition: all .2s; }
    .nav-item:hover, .nav-item.active { color: #fff; background: var(--bg3); }
    .main { flex: 1; padding: 30px; overflow-y: auto; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .input { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 13px; }
    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; font-size: 13px; transition: all .2s; }
    .btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .overview-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .card .label { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
    .card .value { font-size: 28px; font-weight: 700; color: #fff; }
    .card .change { font-size: 13px; margin-top: 4px; }
    .card .change.up { color: var(--green); }
    .card .change.down { color: var(--red); }
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .chart-card h3 { font-size: 15px; margin-bottom: 12px; }
    .chart-card canvas { max-height: 280px; }
    .chart-card.full { grid-column: 1 / -1; }
    .heatmap { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
    .heatmap-cell { aspect-ratio: 1; border-radius: 3px; position: relative; cursor: pointer; }
    .heatmap-cell:hover::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 10; }
    .heatmap-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text2); margin-top: 4px; }
    .day-labels { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--text2); margin-right: 4px; }
    .top-tweets { margin-bottom: 24px; }
    .tweet-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
    .tweet-text { flex: 1; font-size: 14px; margin-right: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tweet-metrics { display: flex; gap: 16px; font-size: 13px; color: var(--text2); flex-shrink: 0; }
    .tweet-metrics span { white-space: nowrap; }
    .loading { text-align: center; padding: 40px; color: var(--text2); }
    select.input { cursor: pointer; }
  </style>
</head>
<body>
  <aside class="sidebar-left"></aside>

  <main class="main">
    <h1>📊 Analytics Dashboard</h1>

    <div class="toolbar">
      <input type="text" class="input" id="username-input" placeholder="@username" value="">
      <select class="input" id="range-select">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last year</option>
      </select>
      <button class="btn primary" id="load-btn">Load Analytics</button>
      <button class="btn" id="export-btn">📥 Export</button>
      <button class="btn" id="compare-btn">⚔️ Compare</button>
    </div>

    <div class="overview-cards" id="overview-cards">
      <div class="card"><div class="label">Followers</div><div class="value" id="card-followers">—</div><div class="change" id="card-followers-change"></div></div>
      <div class="card"><div class="label">Following</div><div class="value" id="card-following">—</div><div class="change" id="card-following-change"></div></div>
      <div class="card"><div class="label">Tweets</div><div class="value" id="card-tweets">—</div><div class="change" id="card-tweets-change"></div></div>
      <div class="card"><div class="label">Avg Engagement</div><div class="value" id="card-engagement">—</div><div class="change" id="card-engagement-change"></div></div>
      <div class="card"><div class="label">Growth Rate</div><div class="value" id="card-growth">—</div><div class="change" id="card-growth-change"></div></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>📈 Follower Growth</h3>
        <canvas id="follower-chart"></canvas>
      </div>
      <div class="chart-card">
        <h3>💬 Engagement Over Time</h3>
        <canvas id="engagement-chart"></canvas>
      </div>
      <div class="chart-card">
        <h3>❤️ Likes vs Retweets</h3>
        <canvas id="likes-rts-chart"></canvas>
      </div>
      <div class="chart-card">
        <h3>📊 Content Types</h3>
        <canvas id="content-type-chart"></canvas>
      </div>
      <div class="chart-card full">
        <h3>🔥 Best Time to Post (Engagement Heatmap)</h3>
        <div style="display:flex;">
          <div class="day-labels" id="day-labels"></div>
          <div style="flex:1;">
            <div class="heatmap" id="heatmap"></div>
            <div class="heatmap-labels" id="heatmap-hours"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="top-tweets">
      <h3 style="margin-bottom: 12px;">🏆 Top Performing Tweets</h3>
      <div id="top-tweets-list"></div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.origin;
    let charts = {};

    const chartDefaults = {
      responsive: true,
      plugins: { legend: { labels: { color: '#888' } } },
      scales: {
        x: { ticks: { color: '#888' }, grid: { color: '#222' } },
        y: { ticks: { color: '#888' }, grid: { color: '#222' } },
      },
    };

    // ── Chart Init ──
    function initCharts() {
      const ctx1 = document.getElementById('follower-chart').getContext('2d');
      charts.followers = new Chart(ctx1, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Followers', data: [], borderColor: '#1d9bf0', backgroundColor: 'rgba(29,155,240,.1)', fill: true, tension: 0.3 }] },
        options: chartDefaults,
      });

      const ctx2 = document.getElementById('engagement-chart').getContext('2d');
      charts.engagement = new Chart(ctx2, {
        type: 'line',
        data: { labels: [], datasets: [
          { label: 'Likes', data: [], borderColor: '#ff4444', tension: 0.3 },
          { label: 'Replies', data: [], borderColor: '#1d9bf0', tension: 0.3 },
          { label: 'Retweets', data: [], borderColor: '#00c853', tension: 0.3 },
        ] },
        options: chartDefaults,
      });

      const ctx3 = document.getElementById('likes-rts-chart').getContext('2d');
      charts.likesRts = new Chart(ctx3, {
        type: 'bar',
        data: { labels: [], datasets: [
          { label: 'Likes', data: [], backgroundColor: 'rgba(255,68,68,0.6)' },
          { label: 'Retweets', data: [], backgroundColor: 'rgba(0,200,83,0.6)' },
        ] },
        options: chartDefaults,
      });

      const ctx4 = document.getElementById('content-type-chart').getContext('2d');
      charts.contentType = new Chart(ctx4, {
        type: 'doughnut',
        data: {
          labels: ['Original', 'Reply', 'Retweet', 'Quote'],
          datasets: [{ data: [0, 0, 0, 0], backgroundColor: ['#1d9bf0', '#00c853', '#ffb800', '#ff4444'] }],
        },
        options: { responsive: true, plugins: { legend: { labels: { color: '#888' } } } },
      });
    }

    // ── Heatmap ──
    // Renders a 7x24 engagement heatmap from real engagement-series data.
    // `series` is the engagementSeries array from /api/analytics/dashboard/:username,
    // where each entry has { date, totalEngagements }. We bucket by day-of-week + hour.
    function renderHeatmap(series) {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const dayLabels = document.getElementById('day-labels');
      dayLabels.innerHTML = days.map(d => `<div style="height:20px;display:flex;align-items:center;">${d}</div>`).join('');

      const heatmap = document.getElementById('heatmap');
      heatmap.style.gridTemplateColumns = 'repeat(24, 1fr)';
      heatmap.style.gridTemplateRows = `repeat(7, 20px)`;

      // Build a 7x24 grid of engagement totals from real series data.
      const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
      if (Array.isArray(series)) {
        for (const point of series) {
          const d = new Date(point.date);
          const dow = d.getUTCDay();
          const hour = d.getUTCHours();
          grid[dow][hour] += Number(point.totalEngagements) || 0;
        }
      }

      let html = '';
      const maxVal = Math.max(...grid.flat(), 1);

      for (let day = 0; day < 7; day++) {
        for (let hour = 0; hour < 24; hour++) {
          const val = grid[day][hour];
          const intensity = val / maxVal;
          const bg = `rgba(29, 155, 240, ${0.05 + intensity * 0.9})`;
          html += `<div class="heatmap-cell" style="background:${bg}" data-tooltip="${days[day]} ${hour}:00 — ${Math.round(val)} engagements"></div>`;
        }
      }
      heatmap.innerHTML = html;

      const hoursLabels = document.getElementById('heatmap-hours');
      hoursLabels.innerHTML = Array.from({ length: 24 }, (_, i) => `<span>${i}</span>`).join('');
    }

    // ── Empty state ──
    function showEmptyState(message) {
      const container = document.getElementById('top-tweets-list');
      container.innerHTML = `<div class="loading">${message}</div>`;
      ['card-followers', 'card-following', 'card-tweets', 'card-engagement', 'card-growth'].forEach((id) => {
        document.getElementById(id).textContent = '—';
      });
      ['card-followers-change', 'card-following-change', 'card-tweets-change', 'card-engagement-change', 'card-growth-change'].forEach((id) => {
        const el = document.getElementById(id);
        el.textContent = '';
        el.className = 'change';
      });
      // Reset charts to empty.
      Object.values(charts).forEach((c) => {
        c.data.labels = [];
        c.data.datasets.forEach((ds) => { ds.data = []; });
        c.update();
      });
      // Reset content-type doughnut to zeros (no demo data).
      charts.contentType.data.datasets[0].data = [0, 0, 0, 0];
      charts.contentType.update();
      renderHeatmap([]);
    }

    // ── Load Data ──
    // Calls the composite dashboard endpoint and renders real API data only.
    // No demo/random fallback — empty arrays show an empty-state message.
    async function loadAnalytics() {
      const username = document.getElementById('username-input').value.replace('@', '').trim();
      if (!username) { alert('Enter a username'); return; }

      const days = parseInt(document.getElementById('range-select').value);
      const loadBtn = document.getElementById('load-btn');
      loadBtn.textContent = 'Loading…';
      loadBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/api/analytics/dashboard/${username}?days=${days}&limit=10`);
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${response.status}`);
        }
        const data = await response.json();
        updateDashboard(data, username, days);
      } catch (error) {
        console.error('❌ Analytics load error:', error);
        showEmptyState(`⚠️ ${error.message}`);
      } finally {
        loadBtn.textContent = 'Load Analytics';
        loadBtn.disabled = false;
      }
    }

    function fmtNum(n) {
      const v = Number(n) || 0;
      return v.toLocaleString();
    }

    function fmtChange(change, suffix = '') {
      const v = Number(change) || 0;
      const sign = v >= 0 ? '+' : '';
      return `${sign}${v.toLocaleString()}${suffix}`;
    }

    function setCardValue(id, value) {
      document.getElementById(id).textContent = value;
    }

    function setCardChange(id, change, suffix = '') {
      const el = document.getElementById(id);
      const v = Number(change) || 0;
      el.textContent = suffix ? `${fmtChange(v)}${suffix}` : fmtChange(v);
      el.className = `change ${v >= 0 ? 'up' : 'down'}`;
    }

    // Render the composite dashboard payload from /api/analytics/dashboard/:username.
    function updateDashboard(data, username, days) {
      const ov = data.overview || {};
      const growth = data.followerGrowth || [];
      const ratioSeries = data.ratioSeries || [];
      const engSeries = data.engagementSeries || [];
      const topTweets = data.topTweets || [];

      // ── Overview cards ──
      setCardValue('card-followers', fmtNum(ov.followers));
      setCardChange('card-followers-change', ov.followerChange, ` (${ov.followerPct}%)`);

      setCardValue('card-following', fmtNum(ov.following));
      const followingChangeEl = document.getElementById('card-following-change');
      followingChangeEl.textContent = `ratio ${ov.followingRatio}`;
      followingChangeEl.className = 'change';

      setCardValue('card-tweets', fmtNum(ov.tweets));
      const tweetsChangeEl = document.getElementById('card-tweets-change');
      tweetsChangeEl.textContent = `over ${days} days`;
      tweetsChangeEl.className = 'change';

      const engPct = ((ov.engagementRate || 0) * 100).toFixed(2);
      setCardValue('card-engagement', `${engPct}%`);
      setCardChange('card-engagement-change', ov.engagementChange);

      setCardValue('card-growth', `${ov.followerPct}%`);
      const growthChangeEl = document.getElementById('card-growth-change');
      growthChangeEl.textContent = `per ${days} days`;
      growthChangeEl.className = `change ${(ov.followerChange || 0) >= 0 ? 'up' : 'down'}`;

      // ── Follower growth chart ──
      if (growth.length) {
        const labels = growth.map(p => new Date(p.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
        const fData = growth.map(p => p.followers);
        charts.followers.data.labels = labels;
        charts.followers.data.datasets[0].data = fData;
        charts.followers.update();
      } else {
        charts.followers.data.labels = [];
        charts.followers.data.datasets[0].data = [];
        charts.followers.update();
      }

      // ── Engagement over time chart ──
      if (engSeries.length) {
        const engLabels = engSeries.map(p => new Date(p.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
        charts.engagement.data.labels = engLabels;
        charts.engagement.data.datasets[0].data = engSeries.map(p => p.totalEngagements);
        charts.engagement.data.datasets[1].data = engSeries.map(p => Math.round((p.engagementRate || 0) * (p.totalImpressions || 0)));
        charts.engagement.data.datasets[2].data = engSeries.map(p => p.totalImpressions);
        charts.engagement.update();
      } else {
        charts.engagement.data.labels = [];
        charts.engagement.data.datasets.forEach((ds) => { ds.data = []; });
        charts.engagement.update();
      }

      // ── Likes vs Retweets bar chart (from top tweets) ──
      if (topTweets.length) {
        const ttLabels = topTweets.map((t, i) => `#${i + 1}`);
        charts.likesRts.data.labels = ttLabels;
        charts.likesRts.data.datasets[0].data = topTweets.map(t => t.likes);
        charts.likesRts.data.datasets[1].data = topTweets.map(t => t.retweets);
        charts.likesRts.update();
      } else {
        charts.likesRts.data.labels = [];
        charts.likesRts.data.datasets.forEach((ds) => { ds.data = []; });
        charts.likesRts.update();
      }

      // ── Content types doughnut (from top tweets: original vs reply vs retweet vs quote) ──
      // TweetSnapshot rows don't carry an explicit type, so we approximate from the
      // presence of reply/quote/retweet counts. This is real data, not random.
      const counts = { Original: 0, Reply: 0, Retweet: 0, Quote: 0 };
      for (const t of topTweets) {
        if (Number(t.quotes) > 0) counts.Quote++;
        else if (Number(t.replies) > 0 && Number(t.retweets) === 0) counts.Reply++;
        else if (Number(t.retweets) > Number(t.likes || 0)) counts.Retweet++;
        else counts.Original++;
      }
      charts.contentType.data.datasets[0].data = [counts.Original, counts.Reply, counts.Retweet, counts.Quote];
      charts.contentType.update();

      // ── Heatmap from engagement series ──
      renderHeatmap(engSeries);

      // ── Top tweets list ──
      renderTopTweets(topTweets);
    }

    function renderTopTweets(tweets) {
      const container = document.getElementById('top-tweets-list');
      if (!Array.isArray(tweets) || !tweets.length) {
        container.innerHTML = '<div class="loading">No top tweets found for this period.</div>';
        return;
      }
      container.innerHTML = tweets.map((t, i) => `
        <div class="tweet-row">
          <div class="tweet-text">${escapeHtml(t.text || `Tweet ${t.tweetId}`)}</div>
          <div class="tweet-metrics">
            <span>🏆 ${t.engagementScore ?? 0}</span>
            <span>❤️ ${fmtNum(t.likes)}</span>
            <span>🔁 ${fmtNum(t.retweets)}</span>
            <span>💬 ${fmtNum(t.replies)}</span>
            <span>👁️ ${fmtNum(t.views)}</span>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Events ──
    document.getElementById('load-btn').onclick = loadAnalytics;
    document.getElementById('username-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadAnalytics(); });

    document.getElementById('export-btn').onclick = () => {
      const username = document.getElementById('username-input').value.replace('@', '').trim();
      if (!username) return;
      window.open(`${API_BASE}/api/analytics/export/${username}?format=csv`, '_blank');
    };

    document.getElementById('compare-btn').onclick = () => {
      const others = prompt('Enter usernames to compare (comma-separated):');
      if (!others) return;
      alert('Comparison feature: Use CLI `unfollowx analytics compare` for detailed comparison.');
    };

    // ── Init ──
    initCharts();
    renderHeatmap([]);
  </script>
<script src="/js/sidebar.js"></script>
</body>
</html>
