          - generic [ref=e119]:
            - generic [ref=e121]: "I just shared Meta's quarterly earnings report. AI is accelerating our core business today, powering our next generation of products, and opening the door to entirely new enterprise opportunities. The results are already showing, and I'm optimistic about the potential ahead. Here's the transcript of what I said on the call:"
            - generic [ref=e123]: We had a strong quarter for our community and business with 3.6 billion people using at least one of our apps each day. We reached several milestones. Instagram reached 2 billion daily actives. Threads crossed 500 million monthly actives, making it the fastest growing conversation app ever. Facebook has reached more than 2 billion daily actives for a while now. WhatsApp just hit an all-time messaging record, peaking at 30 million messages sent per second during the World Cup final. And also, Kunal Shah just joined as our new head of WhatsApp. He built one of India's most important payment companies and will be a great addition to the team. We also shipped some strong new models from Meta Superintelligence Labs and released new glasses. Overall, the scale and reach of our community across our apps is pretty remarkable, and it gives us a strong platform for delivering new innovations to billions of people.
            - generic [ref=e125]: The opportunity in front of us is massive. First, we are now at a point where our investments in AI are accelerating every major part of our core business. They're improving the experience for people using our apps, driving better performance for advertisers, and helping our teams build new experiences and ship faster. Second, we're developing new personal agents that will be the foundation for our next wave of products and revenue lines in the months and years ahead. Third, we see a large enterprise opportunity to sell to businesses, including APIs, business agents, potentially selling compute directly, and other services that we're building for large customers. I'm going to spend some time today laying out exactly how our investments are delivering results today and the opportunities that we see over time.
            - generic [ref=e127]: For accelerating our core business, we're seeing strong and promising results in several areas.
            - generic [ref=e129]: In Instagram and Facebook, I'm very optimistic about our work to integrate large language models into our recommendation systems. LLMs add a first-principles understanding of what the content is about and why it is compelling, as well as a deeper understanding of what people are interested in and what their goals are when they're using our apps. This means we can show more relevant and engaging content that better reflects people's goals and interests.
            - generic [ref=e131]: Our new Muse Image and Muse Video models will also dramatically expand the universe of content that people can discover across our platforms. There are already two large sets of content to draw from -- first from your friends and the people you follow, and second from creators you don't follow -- but now there is going to be a whole new and nearly infinite universe of personalized content. This is going to make our services a lot more useful and engaging for people.
            - generic [ref=e133]: For ads, we are using LLMs to improve how our systems predict and rank the ads that we show. We've expanded the context we can take into account around a person's organic and ads activity to determine an ad's relevance, driving significant increases in relevance and conversions on both Facebook and Instagram. On a dollar basis, our ads business is reporting faster year-over-year revenue growth than any other company's reported ad business -- so these AI investments are paying off.
            - generic [ref=e135]: We are also seeing a lot of demand for our new AI-powered creative tools. 9 million small businesses on our platforms are now using at least one of our AI ad creative tools, and we're rolling out new end-to-end creative solutions that help advertisers translate performance data into their creative decisions. Muse Image is going to supercharge this. The model can analyze images, improve its own work, and produce better ad variations based on advertiser inputs. We're getting great feedback on this so far.
            - generic [ref=e137]: We also just launched Meta One, a new subscription offering that provides more tools and AI features across our apps. As demand grows, we're going to offer a variety of different tiers and pricing options there as well.
            - generic [ref=e139]: I'm also excited about how AI is helping our teams speed up product development. Earlier this year we shipped Instagram Instants. We also just launched Forum, a standalone Groups app, and Seller, a standalone Marketplace app. I expect it to become a lot easier to ship new apps, so we're planning to build out more ideas and use our recommendation systems to scale them to the people who will find them interesting, as we've done with Threads.
            - generic [ref=e141]: It's been a little more than a year since we launched Meta Superintelligence Labs and our trajectory is strong. In the last month we shipped Muse Spark 1.1 and Muse Image. Since we rebuilt Meta AI and integrated Muse Spark, we've seen a 60% increase in the number of people interacting with the assistant each day and that continues to grow quickly week over week.
            - generic [ref=e143]: Muse Spark 1.1 is a strong agentic and coding model that is very efficient and excels at computer use, tool use, and multimodal understanding. It's available through our new public API, and we're ramping up distribution through partner channels and more coding agents over the coming weeks. We're also building out features to make it easier for enterprises to adopt Muse Spark and that is an area we expect to continue focusing on.
            - generic [ref=e145]: One reason we're so focused on making Muse Spark great at agentic capabilities is that we think there's a very big opportunity to ship a few types of agents that are aligned with our mission and business.
            - generic [ref=e147]: The first is personal agents. Soon, we will have agents that can work 24/7 on your behalf to help achieve your goals and improve your life, your health, your relationships, your finances -- whatever you want. The first domain that agents have really taken off in is coding, but engineers are more technical and willing to spend time making those agents work. To build great personal agents, this needs to be a great consumer product that just works out of the box and is easy enough for billions of people to adopt and use. I'm very excited about this and we'll have more to share soon.
            - generic [ref=e149]: As we move towards a future where we're all interacting with multiple agents, I think that WhatsApp and our other messaging surfaces are going to become increasingly important. WhatsApp is already the leading surface where people engage with Meta AI -- and as we build out a platform for more agents across our messaging apps, we're going to innovate on how to deliver a private and secure AI experience. We launched incognito mode this quarter on WhatsApp and the Meta AI app, allowing people to have private conversations with their AI assistant that even Meta can't see. We're planning to make strong privacy and security a fundamental part of the agents we're building as well.
            - generic [ref=e151]: I'm also very excited about our progress with business agents. We made Meta Business Agents available globally this quarter on WhatsApp and Messenger, and there are already more than 1 million businesses using them to talk to their customers or complete sales every week. We're rolling business agents out on Instagram now too. One interesting thing about having an agent talk to your customers every day is that it learns over time and can bring all those insights back to you. So we're building more agentic capabilities to summarize all the conversations, digest what happened overnight, and surface what customers are asking for. Soon, it'll go further, including suggesting ways to grow your business, giving you competitive intelligence and real-time insights into what's working and what's not. And over time, we'd like to build this into a business-in-a-box service that can help you start and run a whole business using Meta's platforms.
            - generic [ref=e153]: In terms of how we'll monetize these, we have a mix of subscriptions, volume-based pricing, and I expect that we're going to continue to evolve more of these products to be like our ad systems where businesses only pay us when we achieve results for them. Over time, that will let us run an efficient auction over our compute, similar to how we do that for advertisers today.
            - generic [ref=e155]: As AI usage in our products and business continues to ramp, we continue to invest aggressively in infrastructure to meet the demand. Yesterday, as part of our Meta Compute effort, we announced a new strategic venture with BlackRock to develop a new 1GW data center in El Paso, Texas.
            - generic [ref=e157]: Overall, we expect that a significant portion of our compute is going to go towards training our models, growing our core business, and delivering personal agents and new products. But we also expect to grow a large business serving large customers as well. We've built our API, we're rolling out business agents, we're getting a lot of offers for compute at a significant premium over what we paid for it, and we have more coding and productivity tools on our roadmap as well. And we'll have more to share on all of this soon.
            - generic [ref=e159]: As we get closer to personal superintelligence, we're also going to need hardware that allows you to seamlessly interact with it. Glasses are the ideal form factor since they can be with you throughout the day and they can assist you without pulling you away from the moment. Our glasses remain one of the fastest-growing consumer electronics of all time, and we continue adding to the line-up.
            - generic [ref=e161]: We just released our own line of Meta Glasses in collaboration with EssilorLuxottica, including a style we designed with Kylie Jenner. They're the first glasses to ship with Muse Spark out of the box so that they can understand what you're seeing and give even more helpful answers. Early sales have been strong, exceeding our expectations. We'll have more to share on our glasses line-up at this year's Connect conference on September 23rd, so I encourage you to tune in then.
            - generic [ref=e163]: Before I wrap, I want to mention that I just published an op-ed about why I'm so optimistic that we're building a positive future for everyone. At Meta, we've always built technology to put power in people's hands so that they can connect with the people they care about and shape their world in the ways they want. It's why we've always focused on making our products affordable and accessible to everyone. And it's a strategy that has served both our community and our business well.
            - generic [ref=e165]: As we enter this next chapter, that same philosophy is guiding how we approach developing AI. We're the only major company building AI with the primary goal of putting superintelligence directly into people's hands. Rather than centralizing superintelligence, we're focused on distributing it widely and giving everyone the ability to direct it towards what matters to them. That's the way that society has always made progress. I think these are the right values for building a positive AI future. And if we help build this, then I think we'll continue to build a very strong business as well.
            - generic [ref=e167]: That's everything I wanted to cover up front today. AI is improving our core business -- it's making our apps more relevant, and delivering better results for businesses. We're starting to deliver more novel products, and we'll have a lot more there soon as well. We're investing aggressively because the potential is huge and we know there are many ways to deliver value here. As always, I'm grateful to all of you for being on this journey with us.
